:root{
  --bg:#0B0F14;
  --surface:#121826;
  --surface2:#161E2E;
  --line:#1E293B;
  --line-soft:#1E293B;
  --text:#F8FAFC;
  --muted:#94A3B8;
  --teal:#22D3EE;
  --violet:#8B5CF6;
  --green:#10B981;
  --amber:#F59E0B;
  --orange:#F59E0B;
  --yellow:#F59E0B;
  --pale-yellow:#161E2E;
  --pale-green:#0C1F16;
  --pale-red:#1F1214;
  --red:#EF4444;
  --brick:#EF4444;
  --paper:#121826;
  --paper2:#161E2E;
  --paper-line:#1E293B;
  --ink:#F8FAFC;
  --ink-muted:#94A3B8;
  --safe-area-inset-top:0px;
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  line-height:1.6
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer
}

input,select,textarea{
  background:#0F172A;
  border:1px solid #334155;
  color:#F8FAFC;
  border-radius:8px;
  padding:10px 12px;
  outline:none;
  width:100%
}

input:focus,select:focus,textarea:focus{
  border:1px solid #22D3EE;
  box-shadow:0 0 0 3px rgba(34,211,238,.22)
}

input[type="checkbox"],input[type="radio"]{
  width:18px;
  height:18px;
  accent-color:#22D3EE
}

input[type="range"]{
  padding:0
}

.card{
  background:#121826;
  border:1px solid #1E293B;
  border-radius:16px;
  padding:18px;
  box-shadow:0 8px 24px rgba(0,0,0,.28)
}

.card h3{
  font-family:Inter,system-ui,sans-serif;
  font-weight:700;
  letter-spacing:-.01em;
  color:#F8FAFC
}

.chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:1px solid #334155;
  border-radius:999px;
  padding:4px 8px;
  font-size:12px;
  background:#161E2E;
  color:#F8FAFC
}

.btn{
  background:#22D3EE;
  color:#0B0F14;
  border:1px solid #22D3EE;
  border-radius:8px;
  padding:10px 15px;
  font-weight:700
}

.btn:hover{
  background:#67E8F9;
  border-color:#67E8F9;
  color:#0B0F14
}

.btn:active{
  transform:translateY(1px)
}

.btn:disabled{
  opacity:.45;
  cursor:not-allowed
}

.btn2{
  background:transparent;
  color:#F8FAFC;
  border:1px solid #334155;
  border-radius:8px;
  padding:10px 13px;
  font-weight:600
}

.btn2:hover{
  background:#1A2436;
  border-color:#475569
}

.btn2:disabled{
  opacity:.45;
  cursor:not-allowed
}

.btnDanger{
  background:#EF4444;
  color:#fff;
  border:1px solid #EF4444;
  border-radius:8px;
  padding:10px 13px;
  font-weight:600
}

.btnDanger:hover{
  background:#F87171
}

.small{
  font-size:12px;
  color:#94A3B8;
  line-height:1.65
}

.kpi{
  font-size:clamp(32px,3.2vw,40px);
  font-weight:800;
  line-height:1;
  font-family:Inter,system-ui,sans-serif;
  letter-spacing:-.02em;
  color:#F8FAFC
}

.eyebrow{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.12em;
  color:#94A3B8;
  font-family:Inter,system-ui,sans-serif;
  font-weight:600;
  display:inline-flex;
  align-items:center;
  gap:8px
}

.eyebrow::before{
  content:"";
  width:8px;
  height:8px;
  background:#22D3EE;
  display:inline-block;
  flex-shrink:0;
  border-radius:50%
}

.mono{
  font-family:'JetBrains Mono',monospace
}

.serif{
  font-family:Inter,system-ui,sans-serif
}

.serif-italic{
  font-family:Inter,system-ui,sans-serif;
  font-style:italic;
  font-weight:400
}

.navbtn{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  text-align:left;
  background:transparent;
  border:0;
  border-left:3px solid transparent;
  color:#94A3B8;
  padding:10px 10px 10px 12px;
  border-radius:0 8px 8px 0;
  font-weight:500
}

.navbtn:hover{
  background:#161E2E;
  color:#F8FAFC
}

.navbtn.active{
  background:#0E2A33;
  color:#22D3EE;
  border-left-color:#22D3EE;
  font-weight:600
}

.navbtn.active .navdot{
  background:#22D3EE
}

.navbtn .navnum{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  opacity:.7
}

.navdot{
  width:7px;
  height:7px;
  background:transparent;
  flex-shrink:0;
  border-radius:50%
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px
}

th{
  text-align:left;
  color:#94A3B8;
  background:#121826;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.12em;
  padding:11px 10px;
  border-bottom:1px solid #1E293B;
  font-family:Inter,system-ui,sans-serif;
  font-weight:600
}

td{
  padding:11px 10px;
  border-bottom:1px solid #1E293B;
  vertical-align:top;
  overflow-wrap:anywhere;
  background:transparent;
  color:#F8FAFC
}

tbody tr:hover td{
  background:#1A2436
}

::-webkit-scrollbar{
  height:8px;
  width:8px
}

::-webkit-scrollbar-thumb{
  background:#334155;
  border-radius:99px
}

.badgeSuccess,.badgeFail,.badgeRun,.badgeCancel{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  font-weight:600;
  border-radius:999px;
  padding:3px 9px
}

.badgeSuccess{
  color:#ECFDF5;
  background:rgba(16,185,129,.18)
}

.badgeFail{
  color:#FEF2F2;
  background:rgba(239,68,68,.18)
}

.badgeRun{
  color:#F0F9FF;
  background:rgba(56,189,248,.18)
}

.badgeCancel{
  color:#F1F5F9;
  background:rgba(148,163,184,.18)
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  display:inline-block;
  flex-shrink:0
}

.search-underline{
  background:#0F172A!important;
  border:1px solid #334155!important;
  border-radius:999px!important;
  padding:10px 12px 10px 36px!important
}

.search-underline:focus{
  border-color:#22D3EE!important;
  box-shadow:0 0 0 3px rgba(34,211,238,.22)!important
}

.tabbtn{
  background:#161E2E!important;
  border:1px solid #1E293B!important;
  border-radius:999px!important;
  padding:8px 14px!important;
  color:#94A3B8!important;
  font-weight:600;
  font-family:Inter,system-ui,sans-serif;
  font-size:13px
}

.tabbtn.active{
  background:#22D3EE!important;
  color:#0B0F14!important;
  border-color:#22D3EE!important
}

.paper{
  background:#121826;
  color:#F8FAFC;
  border:1px solid #1E293B;
  border-radius:16px
}

.paper .small{
  color:#94A3B8
}

.paper input,.paper select,.paper textarea{
  background:#0F172A;
  color:#F8FAFC;
  border-color:#334155
}

.paper .btn2{
  color:#F8FAFC;
  border-color:#334155;
  background:transparent
}

.paper .btn2:hover{
  background:#1A2436
}

.paper .chip{
  background:#161E2E;
  color:#F8FAFC;
  border-color:#334155
}

.paper .card{
  background:#161E2E;
  border-color:#1E293B;
  color:#F8FAFC
}

.paper .card h3{
  color:#F8FAFC
}

.paper table th{
  color:#94A3B8;
  border-bottom-color:#1E293B;
  background:#121826
}

.paper table td{
  border-bottom-color:#1E293B;
  color:#F8FAFC
}

.paper tbody tr:hover td{
  background:#1A2436
}

.paper .eyebrow{
  color:#94A3B8
}

.paper .footnote{
  color:#94A3B8
}

.footnote{
  font-family:Inter,system-ui,sans-serif;
  color:#94A3B8;
  font-size:13px;
  line-height:1.6
}

.torn{
  border-top:3px solid #22D3EE
}

.highlighter{
  background:rgba(34,211,238,.16);
  padding:0 4px;
  border-radius:4px
}

@keyframes pulseSq{
  0%,100%{
    opacity:1
  }

  50%{
    opacity:.25
  }
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0B0F14;
    --surface:#121826;
    --text:#F8FAFC;
  }
}
