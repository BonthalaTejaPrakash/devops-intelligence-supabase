name: Deploy DevOps Intelligence to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create public browser configuration
        env:
          SUPABASE_URL: https://wwdtwrjepzrfbfzysddg.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_yJ1KMSxYKjXmvLB2cL1n_A_DC9qXkVA
        run: |
          printf '{\n  "url": "%s",\n  "publicKey": "%s",\n  "apiUrl": ""\n}\n' \
            "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" > supabase.local.json
      - name: Package static site
        run: |
          mkdir -p site
          cp index.html site/index.html
          cp supabase.local.json site/supabase.local.json
          cp -R src site/src
          cp .gitignore site/.gitignore 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
